<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型状态</title>
  <link rel="icon" type="image/png" href="/state/favicon.png">
  <link rel="stylesheet" href="/state/style.css">
  <script src="/state/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">O / ADVERSARIAL</p><h1 data-text="title">模型状态</h1><p class="muted" data-text="intro">探测状态与健康基线，实时同步。</p></div>
    <div class="preferences">
      <label><span data-text="language">语言</span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ru">Русский</option></select></label>
      <label><span data-text="theme">外观</span><select id="theme"><option value="system" data-text="system">跟随系统</option><option value="white" data-text="white">纯白</option><option value="paper" data-text="paper">羊毛纸</option><option value="dark" data-text="dark">暗色</option></select></label>
    </div>
  </header>
  <div class="sync"><span id="connection" role="status">正在连接</span><span id="updated" class="muted"></span></div>
  <section class="stats" aria-label="Statistics">
    <div><span class="muted" data-text="probeStatus">探测状态</span><strong id="status">—</strong></div>
    <div><span class="muted" data-text="priority">优先探测模型</span><strong id="priority">—</strong></div>
    <div><span class="muted" data-text="counts">探测成功 / 总探测</span><strong id="counts">—</strong></div>
  </section>
  <section class="panel">
    <div class="section-title"><h2><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7l8-4Z"/><path d="m8 12 3 3 5-6"/></svg><span data-text="baselines">模型健康基线</span></h2><span class="muted" data-text="readonly">只读镜像</span></div>
    <div class="settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h8m4 0h4M4 17h3m4 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-text="settings">探测设置</span><span id="settings" class="muted">—</span></div>
    <div id="table-region" class="table-wrap" tabindex="0" role="region" aria-label="模型健康基线，可横向滚动">
      <table><thead><tr><th data-text="model">模型</th><th data-text="length">状态长度</th><th data-text="source">来源</th><th data-text="issued">签发时间（UTC+8）</th><th data-text="expires">到期时间（UTC+8）</th><th data-text="validity">有效期 / 状态</th></tr></thead><tbody id="models"><tr><td colspan="6" class="empty" data-text="waiting">等待首次状态同步</td></tr></tbody></table>
    </div>
  </section>
  <footer><span data-text="footer">倒计时在本页计算 · 时间为 UTC+8</span><span data-text="readOnlyNote">此页面不提供插件控制功能</span></footer>
</main>
</body>
</html>
