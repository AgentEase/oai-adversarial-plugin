# Add inside an existing HTTPS server block; preserve its TLS/access settings.
# The receiver's private ingestion port MUST NOT be published here.
location = /state {
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache off;
}

location ^~ /state/ {
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
}
