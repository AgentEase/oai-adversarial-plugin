# Example configuration for the OAI-Adversarial Plugin (plugin id: timezone-override).
# Copy the block below into your CPA config.yaml under `plugins.configs`.
#
# Notes:
# - Only *.enabled* and the plugin id are required to load the plugin.
# - Every listed field is hot-reloaded: edit the file and CPA reconfigures the
#   plugin without restarting the container.
# - All secrets (proxy URLs) should live in the dedicated proxies file below,
#   not in config.yaml.

plugins:
  enabled: true
  dir: "/CLIProxyAPI/logs/.plugins"
  configs:
    # ---- plugin id (must match the installed .so file name) -----------------
    timezone-override:
      enabled: true
      priority: 100

      # ---- request-side X-Codex-Turn-State rewrite --------------------------
      turn-state-override:
        # Master switch: when enabled, matching requests get the header value
        # replaced before reaching the upstream.
        enabled: true

        # Model prefixes to rewrite (case-insensitive prefix match).
        models:
          - gpt-6-astra

        # Fallback static value used when no fresh baseline is available yet
        # (first start, no recorded history, no seeds file). The primary
        # value is the per-model healthy baseline, which is seeded from
        # server records and refreshed by business observations and manual
        # probe rounds. Only the pristine 292-byte state is accepted.
        value: "REPLACE_WITH_YOUR_TOKEN"

        # true  = always replace an existing client value
        # false = keep a healthy (292-byte) client value; degraded-length
        #         values are still replaced
        force: true

        # ---- probe track (manual mode) --------------------------------------
        probe:
          enabled: true

          # Probe priority order for manual rounds: models are tried in this
          # order, once each, until the round is stopped or the list ends.
          models:
            - gpt-6-astra
            - gpt-5.6-sol
            - gpt-5.6-luna
            - gpt-5.6-terra

          # Credential file with access_token/account_id (auth JSON as produced
          # by CPA's OAuth flow). Keep it outside the repository.
          cred-file: "/root/.cli-proxy-api/your-codex-auth.json"

          # Dedicated secrets file with one egress per line:
          #   direct
          #   socks5://user:pass@host:port
          #   http://user:pass@host:port
          # Rotated in order; each egress is retried attempts-per-proxy times
          # before the next one is used.
          proxies-file: "/CLIProxyAPI/logs/.plugins/proxies.conf"

          # Baseline serving TTL (embedded in the token). Values older than
          # this stop being served until a fresh one arrives.
          ttl-minutes: 55

          # Retry policy for one manual round per model: N attempts per
          # egress, then rotate; the round cap is computed automatically as
          # (number of egress entries) x N. Success stores the baseline;
          # failure only annotates the dashboard (cool-down hint), and
          # nothing restarts automatically.
          probe-interval-seconds: 5
          attempts-per-proxy: 3
          # max-attempts-per-round: 0   # 0/absent = auto (egress count x 3)
          cooldown-minutes: 20
          # ---- egress pool rotation (IPv4/IPv6 mixed friendly) -----------
          # An egress that fails to obtain a healthy state (length anomaly,
          # model mismatch or transport errors) this many times in a row is
          # temporarily removed from rotation; it returns automatically after
          # exit-cooldown-minutes (set 0 to disable the removal). IPv6 exits
          # can be added to the proxies file as socks5h://[2001:db8::1]:1080
          # or http://[2001:db8::1]:8080 and are pooled with IPv4 exits.
          exit-fail-threshold: 3
          exit-cooldown-minutes: 180
          # Minimum usable exits kept in rotation (soonest-expiring entries
          # are released early when the usable set would fall below this).
          exit-min-active: 1
          # Degraded-model rejection is ON by default and restored from the
          # state snapshot across reloads; toggle it from the dashboard
          # header (global switch, independent of the probe track).
          # suspect-threshold: in-round degradation-evidence failures needed
          # before the rejection switch treats the model as degraded (early
          # trigger; the full annotation still wins once the round completes).
          suspect-threshold: 3

          # Upstream request settings for each probe.
          timeout-seconds: 60
          prompt: "hi"
          upstream-url: "https://chatgpt.com/backend-api/codex/responses"

        # ---- deployment seeds (optional) ------------------------------------
        # The plugin seeds missing baselines from, in order:
        #   1. /CLIProxyAPI/logs/.plugins/timezone-override/seeds.json
        #      (map of model -> last known-good 292-byte value; produced by
        #      the open-source-prep scanner from server records/backups)
        #   2. the newest healthy values in its own audit journal
        # A value is only ever drafted when it is exactly 292 bytes and its
        # embedded timestamp decodes; existing baselines are never overwritten.
